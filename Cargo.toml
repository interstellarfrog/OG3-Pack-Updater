[package]
name = "OG3-Pack-Updater"
version = "1.0.0"
edition = "2021"
authors = ["Interstellarfrog","JMBROGB666 - NoNoNoNo666"]
license = "MIT"
build = "build.rs"

[dependencies]
slint = { version = "1.16"}
serde = { version = "1.0", features = ["derive"]}
serde_json = "1.0"
rfd = "0.17"
reqwest = { version = "0.13", features = ["blocking", "json"]}
zip = "8.6"
open = "5.3"
winapi = {version = "0.3", features = ["winuser"]}
winres = "0.1"
sha2 = "0.11"
rayon = "1.12"

[build-dependencies]
slint-build = "1.16"
winres = "0.1"